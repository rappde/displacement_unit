<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Displacement_Unit · Demien Rapp</title>
    <script>
        // eingebettet auf rappde.com/tools? dann ohne titelzeile und credit
        try { if (window.self !== window.top) document.documentElement.classList.add('is-embedded'); } catch (e) { document.documentElement.classList.add('is-embedded'); }
    </script>

    <!-- MANUAL: self-hosted verlangt. Beim Deploy dieses CDN gegen eigene @font-face tauschen. -->

    <style>
        @font-face {
            font-family: "Endless";
            src: url("fonts/Endless.ttf") format("truetype");
            font-display: swap;
        }

        :root {
            --paper: #fff;
            --ink: #000;
            --muted: #595959;
            --soft: #ddd;
            --stage: #000;
            --link: #00e;
            --stroke: 3px;
            --line: 24px;
            --half: 12px;
            --gap: 24px;
            --touch: 44px;
            --controls: 300px;
        }
        @media (max-width: 1023px) { :root { --gap: 18px; } }
        @media (max-width: 767px)  { :root { --gap: 12px; } }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html { background: var(--paper); }
        body {
            margin: 0;
            padding: var(--gap);
            background: var(--paper);
            color: var(--ink);
            font-family: "Endless", Arial, Helvetica, sans-serif;
            font-size: 20px;
            line-height: var(--line);
            -webkit-font-smoothing: none;
        }

        /* titelzeile, nur wenn das tool allein offen ist */
        .topbar {
            border-bottom: var(--stroke) solid var(--ink);
            padding-bottom: var(--half);
            margin-bottom: var(--line);
        }
        .brand {
            margin: 0;
            font-size: 48px;
            line-height: 48px;
            font-weight: 400;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }
        @media (max-width: 767px) { .brand { font-size: 32px; line-height: 36px; } }

        .container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) var(--controls);
            gap: var(--gap);
            align-items: start;
        }

        /* buehne */
        .viewport {
            position: sticky;
            top: var(--gap);
            background: var(--stage);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            overflow: hidden;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: calc(100vh - var(--gap) * 2);
            image-rendering: pixelated;
        }

        .crt-active::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, .25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .rec-indicator {
            position: absolute;
            top: var(--half);
            right: var(--half);
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 20;
            background: var(--ink);
            color: var(--paper);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: .12em;
            padding: 4px 8px;
        }
        .rec-indicator::before {
            content: "";
            width: 10px;
            height: 10px;
            background: var(--paper);
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .rec-indicator::before { animation: none; } }

        /* regler */
        .controls {
            border-left: var(--stroke) solid var(--ink);
            padding-left: var(--gap);
            display: flex;
            flex-direction: column;
            gap: var(--line);
        }

        .eyebrow {
            margin: 0 0 var(--half);
            font-size: 14px;
            line-height: 20px;
            font-weight: 400;
            letter-spacing: .1em;
            text-transform: uppercase;
            border-bottom: var(--stroke) solid var(--ink);
            padding-bottom: var(--half);
        }
        .hint { margin: var(--half) 0 0; font-size: 16px; line-height: var(--line); color: var(--muted); }

        .control-item { display: flex; flex-direction: column; }
        .control-item + .control-item { margin-top: var(--half); }
        .control-header {
            display: flex;
            justify-content: space-between;
            gap: var(--half);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .control-header .val { color: var(--ink); font-variant-numeric: tabular-nums; }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            height: var(--touch);
            margin: 0;
            background: transparent;
            cursor: pointer;
            touch-action: pan-y;
        }
        input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: var(--soft); }
        input[type="range"]::-moz-range-track { height: 3px; background: var(--soft); }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            margin-top: -10.5px;
            background: var(--ink);
            border: 0;
            border-radius: 0;
        }
        input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; background: var(--ink); border: 0; border-radius: 0; }
        input[type="range"]:focus-visible { outline: var(--stroke) solid var(--ink); outline-offset: 3px; }

        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button, .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: var(--touch);
            padding: 8px 12px;
            margin: 0;
            font: inherit;
            font-size: 14px;
            line-height: 20px;
            letter-spacing: .1em;
            text-transform: uppercase;
            background: var(--paper);
            color: var(--ink);
            border: var(--stroke) solid var(--ink);
            border-radius: 0;
            cursor: pointer;
            position: relative;
        }
        button:hover, .file-label:hover, button.active, button.recording { background: var(--ink); color: var(--paper); }
        button:focus-visible, .file-label:focus-within { outline: var(--stroke) solid var(--ink); outline-offset: 3px; }
        button:disabled { opacity: .35; cursor: not-allowed; }
        button:disabled:hover { background: var(--paper); color: var(--ink); }
        .full-width { grid-column: 1 / -1; }

        /* file-input nicht display:none, sonst per tab nicht erreichbar */
        .file-label input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

        footer { margin: 0; font-size: 16px; line-height: var(--line); color: var(--muted); }
        footer a { color: var(--link); }

        @media (max-width: 899px) {
            .container { grid-template-columns: 1fr; }
            .viewport { position: relative; top: 0; }
            canvas { max-height: 50vh; }
            .controls { border-left: 0; padding-left: 0; border-top: var(--stroke) solid var(--ink); padding-top: var(--line); }
        }

        /* eingebettet auf rappde.com/tools: der name steht dort schon, das tool fuellt das iframe */
        .is-embedded .topbar, .is-embedded footer { display: none; }
        .is-embedded body { padding: 0; }
        @media (min-width: 900px) {
            .is-embedded, .is-embedded body { height: 100%; }
            .is-embedded body { overflow: hidden; }
            .is-embedded .container { height: 100%; align-items: stretch; }
            .is-embedded .viewport { position: relative; top: 0; }
            .is-embedded canvas { max-height: 100%; }
            .is-embedded .controls { overflow: auto; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <h1 class="brand">Displacement_Unit</h1>
    </div>
</header>

<main class="container">
    <!-- LINKS: BILD -->
    <section class="viewport" id="viewport">
        <div id="rec-ui" class="rec-indicator">REC</div>
        <canvas id="main-canvas"></canvas>
    </section>

    <!-- RECHTS: PARAMETER -->
    <aside class="controls">
        <div>
            <h2 class="eyebrow">Source</h2>
            <div class="button-group">
                <label class="file-label">
                    Import source
                    <input type="file" id="file-source" accept="image/*,video/*">
                </label>
                <button id="btn-cam">Live_Cam</button>
                <label class="file-label full-width">
                    Import map
                    <input type="file" id="file-map" accept="image/*">
                </label>
            </div>
                <p class="hint">Uses your camera on request. Nothing leaves your browser.</p>
        </div>

        <div>
            <h2 class="eyebrow">Displacement</h2>
            <div class="control-item">
                <div class="control-header"><span>X_Strength</span><span class="val" id="v-x">60</span></div>
                <input type="range" id="s-x" min="-400" max="400" value="60" aria-label="X Strength">
            </div>
            <div class="control-item">
                <div class="control-header"><span>Y_Strength</span><span class="val" id="v-y">0</span></div>
                <input type="range" id="s-y" min="-400" max="400" value="0" aria-label="Y Strength">
            </div>
            <div class="control-item">
                <div class="control-header"><span>Threshold</span><span class="val" id="v-t">100</span></div>
                <input type="range" id="s-t" min="0" max="255" value="100" aria-label="Threshold">
            </div>
        </div>

        <div>
            <h2 class="eyebrow">Output</h2>
            <div class="button-group">
                <button id="btn-save">Save still (PNG)</button>
                <button id="btn-rec">Record video</button>
            </div>
        </div>
    </aside>

    <footer>Made by <a href="https://rappde.com">rappde.com</a></footer>
</main>

<video id="hidden-video" autoplay muted loop playsinline style="display:none"></video>

<script>
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const video = document.getElementById('hidden-video');
    const sX = document.getElementById('s-x');
    const sY = document.getElementById('s-y');
    const sT = document.getElementById('s-t');
    const btnCam = document.getElementById('btn-cam');
    const btnRec = document.getElementById('btn-rec');

    // willReadFrequently: verhindert das Deopt beim wiederholten getImageData
    const pCan = document.createElement('canvas');
    const pCtx = pCan.getContext('2d', { willReadFrequently: true });
    // map-canvas erst anlegen wenn wirklich eine custom-map kommt
    let mCan = null, mCtx = null;

    let mode = 'none', sourceImg = null, mapImg = null;
    let needsRender = false;           // still-modus rendert nur wenn was passiert ist
    let recorder, chunks = [];
    let camStream = null;
    let videoURL = null;               // aktive blob-url der video-quelle, wird revoked

    let outBuf = null, outImg = null;
    let mapCache = null, mapCacheImg = null, mapCacheW = 0, mapCacheH = 0;

    const isMobile = window.matchMedia('(pointer: coarse)').matches
        || window.matchMedia('(max-width: 900px)').matches;

    // Per-Pixel-Loop ist der Flaschenhals: Bewegtbild niedriger auflösen als Stills
    function limitFor(m) {
        if (m === 'image') return isMobile ? 900 : 1200;
        return isMobile ? 540 : 800;
    }

    // captureStream fehlt z.B. auf iOS Safari
    const recSupported = typeof canvas.captureStream === 'function' && typeof window.MediaRecorder === 'function';
    if (!recSupported) {
        btnRec.disabled = true;
        btnRec.textContent = 'Rec n/a';
    }

    document.getElementById('file-source').onchange = (e) => loadFile(e.target.files[0], false);
    document.getElementById('file-map').onchange = (e) => loadFile(e.target.files[0], true);

    // leerer zustand und meldungen: weiss auf der schwarzen buehne
    function drawPlaceholder(text = 'NO INPUT') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        let fs = Math.max(14, Math.round(canvas.width * 0.035));
        ctx.font = fs + 'px Endless, Arial, sans-serif';
        while (fs > 10 && ctx.measureText(text).width > canvas.width * 0.9) { fs--; ctx.font = fs + 'px Endless, Arial, sans-serif'; }
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    }

    function stopCam() {
        if (!camStream) return;
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
        video.srcObject = null;
        btnCam.classList.remove('active');
        btnCam.textContent = 'Live_Cam';
    }

    function loadFile(file, isMap) {
        if (!file) return;
        const url = URL.createObjectURL(file);
        if (!isMap) {
            stopCam();
            if (file.type.startsWith('video/')) {
                if (videoURL) URL.revokeObjectURL(videoURL);   // alte video-quelle freigeben
                videoURL = url;
                mode = 'video';
                video.srcObject = null;
                video.src = url;
                video.onloadedmetadata = () => { initDim(video.videoWidth, video.videoHeight, limitFor('video')); video.play(); };
            } else {
                mode = 'image';
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);                   // bild dekodiert, url weg
                    sourceImg = img;
                    initDim(img.width, img.height, limitFor('image'));
                    needsRender = true;
                };
                img.src = url;
            }
        } else {
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                mapImg = img; mapCacheImg = null; needsRender = true;
            };
            img.src = url;
        }
    }

    function initDim(w, h, limit) {
        // laengere kante limitieren, sonst sprengt ein panorama den loop
        const scale = Math.min(1, limit / Math.max(w, h));
        canvas.width = Math.floor(w * scale);
        canvas.height = Math.floor(h * scale);
    }

    btnCam.onclick = async function() {
        if (camStream) {
            stopCam();
            mode = 'none';
            drawPlaceholder();
            return;
        }
        try {
            camStream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, facingMode: { ideal: 'environment' } }
            });
            video.src = '';                                    // alte datei-quelle vom element loesen
            video.srcObject = camStream;
            mode = 'live';
            video.onloadedmetadata = () => { initDim(video.videoWidth, video.videoHeight, limitFor('live')); video.play(); };
            this.classList.add('active');
            this.textContent = 'Live_Cam';
        } catch (e) { drawPlaceholder('Camera blocked. Allow it or import a file.'); camStream = null; }
    };

    function render() {
        if (mode === 'none') return;
        if ((mode === 'video' || mode === 'live') && video.readyState < 2) return;

        const strX = parseInt(sX.value);
        const strY = parseInt(sY.value);
        const thresh = parseInt(sT.value);

        const w = canvas.width, h = canvas.height;
        const src = mode === 'image' ? sourceImg : video;

        // kein versatz -> loop komplett sparen, direkt durchreichen
        if (strX === 0 && strY === 0) {
            ctx.drawImage(src, 0, 0, w, h);
            return;
        }

        pCan.width = w; pCan.height = h;
        pCtx.drawImage(src, 0, 0, w, h);
        const sData = pCtx.getImageData(0, 0, w, h);
        const pix = sData.data;

        // Displacement-Quelle: Custom-Map (gecacht) oder direkt die Luminanz der Quelle
        let mData;
        if (mapImg) {
            if (mapCacheImg === mapImg && mapCacheW === w && mapCacheH === h) {
                mData = mapCache;
            } else {
                if (!mCan) { mCan = document.createElement('canvas'); mCtx = mCan.getContext('2d', { willReadFrequently: true }); }
                mCan.width = w; mCan.height = h;
                mCtx.drawImage(mapImg, 0, 0, w, h);
                mData = mCtx.getImageData(0, 0, w, h).data;
                mapCache = mData; mapCacheImg = mapImg; mapCacheW = w; mapCacheH = h;
            }
        } else {
            mData = pix;
        }

        const need = pix.length;
        if (!outBuf || outBuf.length !== need) {
            outBuf = new Uint8ClampedArray(need);
            outImg = new ImageData(outBuf, w, h);              // einmal wrappen, nicht pro frame
        }
        outBuf.set(pix);

        const maxX = w - 1, maxY = h - 1;
        const t3 = thresh * 3;                                 // spart die division im heissen pfad
        let i = 0;
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++, i += 4) {
                const sum = mData[i] + mData[i + 1] + mData[i + 2];
                if (sum > t3) {
                    const f = (sum / 3 - 128) / 128;
                    let tx = x + ((f * strX) | 0);             // | 0 truncated symmetrisch um null
                    let ty = y + ((f * strY) | 0);
                    if (tx < 0) tx = 0; else if (tx > maxX) tx = maxX;
                    if (ty < 0) ty = 0; else if (ty > maxY) ty = maxY;
                    const ti = (ty * w + tx) * 4;

                    outBuf[i] = pix[ti];
                    outBuf[i + 1] = pix[ti + 1];
                    outBuf[i + 2] = pix[ti + 2];
                }
            }
        }

        ctx.putImageData(outImg, 0, 0);
    }

    function anim() {
        if ((mode === 'video' || mode === 'live') && video.readyState >= 2) {
            render();
        } else if (needsRender && mode === 'image') {
            needsRender = false;
            render();
        }
        requestAnimationFrame(anim);
    }
    anim();

    [sX, sY, sT].forEach(el => el.oninput = () => {
        document.getElementById('v-' + el.id.split('-')[1]).textContent = el.value;
        if (mode === 'image') needsRender = true;              // loop rendert, nicht jedes event
    });

    document.getElementById('btn-save').onclick = () => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `DR_DISPLACE_${Date.now()}.png`; a.click();
    };

    btnRec.onclick = function() {
        if (recorder && recorder.state === "recording") {
            recorder.stop();
            this.classList.remove('active');
            this.textContent = 'Record video';
            document.getElementById('rec-ui').style.display = "none";
        } else {
            chunks = [];
            const candidates = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=h264', 'video/webm'];
            const mime = candidates.find(t => MediaRecorder.isTypeSupported(t)) || '';
            const ext = mime.includes('mp4') ? 'mp4' : 'webm';
            recorder = new MediaRecorder(canvas.captureStream(30), mime ? { mimeType: mime } : undefined);
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const b = new Blob(chunks, { type: mime || 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b); a.download = `DR_DISPLACE_${Date.now()}.${ext}`; a.click();
            };
            recorder.start();
            this.classList.add('active');
            this.textContent = 'Stop recording';
            document.getElementById('rec-ui').style.display = "flex";
        }
    };

    // Init
    canvas.width = 800; canvas.height = 450;
    drawPlaceholder();
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (mode === 'none') drawPlaceholder(); });
    }
</script>
</body>
</html>
