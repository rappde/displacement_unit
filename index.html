<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DISPLACEMENT_UNIT · Demien Rapp</title>

    <!-- MANUAL: self-hosted verlangt. Beim Deploy dieses CDN gegen eigene @font-face tauschen. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&family=Silkscreen&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #F2F0EB;
            --ink: #0B0B0C;
            --muted: #56565B;
            --line: #D7D4CC;
            --hi: #000000;
            --ink-raise: #E8E5DD;
            --line-soft: #E3E0D8;
            --invert-bg: #0B0B0C;
            --invert-fg: #F2F0EB;

            --container: 1240px;
            --gutter: clamp(18px, 4vw, 56px);
            --ease-out: cubic-bezier(.16, 1, .3, 1);
            --speed: 0.5s;

            --font-display: 'Bricolage Grotesque', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-pixel: 'Silkscreen', monospace;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { margin: 0; }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: clamp(0.95rem, 0.9rem + 0.3vw, 1.05rem);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- INVERTIERTER BLOCK (genau 1x pro Seite) ---- */
        .topbar {
            background: var(--invert-bg);
            color: var(--invert-fg);
            padding: clamp(20px, 3vw, 34px) var(--gutter);
        }
        .topbar-inner {
            max-width: var(--container);
            margin: 0 auto;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .brand {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(2.2rem, 7vw, 5.5rem);
            line-height: 0.88;
            letter-spacing: -0.03em;
            margin: 0;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }
        .brand-meta {
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: clamp(0.72rem, 0.7rem + 0.2vw, 0.82rem);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(242, 240, 235, 0.55);
            margin: 0;
        }
        .pixel {
            font-family: var(--font-pixel);
            font-size: 0.66em;
            color: var(--invert-fg);
            letter-spacing: 0;
        }

        @media (prefers-reduced-motion: no-preference) {
            .brand { animation: glitch var(--speed) var(--ease-out) both; }
            .topbar:hover .brand { animation: glitch var(--speed) var(--ease-out); }
            @keyframes glitch {
                0%   { transform: translateX(0); text-shadow: none; }
                18%  { transform: translateX(-3px); text-shadow: 3px 0 var(--paper), -3px 0 var(--invert-bg); }
                36%  { transform: translateX(2px); text-shadow: -2px 0 var(--paper); }
                54%  { transform: translateX(-1px); text-shadow: 2px 0 var(--paper); }
                100% { transform: translateX(0); text-shadow: none; }
            }
        }

        /* ---- LAYOUT ---- */
        .container {
            max-width: var(--container);
            margin: 0 auto;
            padding: clamp(28px, 5vw, 64px) var(--gutter) clamp(40px, 6vw, 96px);
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: clamp(24px, 4vw, 48px);
            align-items: start;
        }

        @media (max-width: 900px) {
            .container {
                display: flex;
                flex-direction: column;
                gap: 24px;
            }
            .viewport { order: 1; }
            .controls, footer { order: 2; }
            canvas { max-height: 50vh; }
        }

        /* ---- VIEWPORT ---- */
        .viewport {
            width: 100%;
            background: var(--ink-raise);
            border: 1px solid var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            overflow: hidden;
            position: sticky;
            top: 12px;
        }
        canvas {
            max-width: 100%;
            height: auto;
            max-height: 80vh;
            image-rendering: pixelated;
            display: block;
        }

        .rec-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 20;
            background: var(--ink);
            color: var(--paper);
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            padding: 5px 9px;
        }
        .rec-indicator::before {
            content: "";
            width: 9px;
            height: 9px;
            background: var(--paper);
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ---- CONTROLS ---- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: clamp(24px, 3vw, 34px);
        }

        .eyebrow {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .eyebrow::before {
            content: "";
            width: 24px;
            height: 1px;
            background: var(--ink);
            flex: none;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }
        .control-header {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }
        .control-header .val { color: var(--ink); font-weight: 700; }

        /* ---- SLIDERS ---- */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 1px;
            background: var(--line);
            outline: none;
            margin: 16px 0;
            touch-action: pan-y;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 44px;
            height: 22px;
            background: var(--ink);
            border: 1px solid var(--paper);
            border-radius: 0;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 44px;
            height: 22px;
            background: var(--ink);
            border: 1px solid var(--paper);
            border-radius: 0;
            cursor: pointer;
        }
        input[type="range"]:active::-webkit-slider-thumb { background: var(--paper); border-color: var(--ink); }
        input[type="range"]:active::-moz-range-thumb { background: var(--paper); border-color: var(--ink); }
        input[type="range"]:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

        /* ---- BUTTONS ---- */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        button, .file-label {
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--ink);
            border-radius: 0;
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            text-align: center;
            display: block;
            min-height: 46px;
            transition: background var(--speed) var(--ease-out), color var(--speed) var(--ease-out);
        }
        button:hover, .file-label:hover { background: var(--ink); color: var(--paper); }
        button:focus-visible, .file-label:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
        button.active { background: var(--ink); color: var(--paper); }
        button:disabled { opacity: 0.35; cursor: not-allowed; }
        button:disabled:hover { background: var(--paper); color: var(--ink); }

        .full-width { grid-column: span 2; }

        /* file-input nicht display:none -> sonst nicht per tab erreichbar. */
        /* visuell weg, aber fokussierbar; fokusring zeigt das label. */
        .file-label { position: relative; }
        .file-label input[type="file"] {
            position: absolute;
            width: 1px; height: 1px;
            margin: -1px; padding: 0; border: 0;
            opacity: 0;
            overflow: hidden;
        }
        .file-label:focus-within { outline: 2px solid var(--ink); outline-offset: 3px; }

        footer {
            grid-column: 1 / -1;
            margin-top: 8px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            border-top: 1px solid var(--line);
            padding-top: 16px;
        }
        footer a {
            color: var(--ink);
            text-decoration: none;
            border-bottom: 1px solid var(--ink);
            transition: background var(--speed) var(--ease-out), color var(--speed) var(--ease-out);
        }
        footer a:hover { background: var(--ink); color: var(--paper); }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <h1 class="brand">Displacement_Unit</h1>
    </div>
</header>

<main class="container">
    <!-- LINKS: BILD -->
    <section class="viewport" id="viewport">
        <div id="rec-ui" class="rec-indicator">REC</div>
        <canvas id="main-canvas"></canvas>
    </section>

    <!-- RECHTS: PARAMETER -->
    <aside class="controls">
        <div>
            <div class="eyebrow">Source</div>
            <div class="button-group">
                <label class="file-label">
                    Import Source
                    <input type="file" id="file-source" accept="image/*,video/*">
                </label>
                <button id="btn-cam">Live_Cam</button>
                <label class="file-label full-width">
                    Import Map
                    <input type="file" id="file-map" accept="image/*">
                </label>
            </div>
        </div>

        <div>
            <div class="eyebrow">Displacement</div>
            <div class="control-item">
                <div class="control-header"><span>X_Strength</span><span class="val" id="v-x">60</span></div>
                <input type="range" id="s-x" min="-400" max="400" value="60" aria-label="X Strength">
            </div>
            <div class="control-item">
                <div class="control-header"><span>Y_Strength</span><span class="val" id="v-y">0</span></div>
                <input type="range" id="s-y" min="-400" max="400" value="0" aria-label="Y Strength">
            </div>
            <div class="control-item">
                <div class="control-header"><span>Threshold</span><span class="val" id="v-t">100</span></div>
                <input type="range" id="s-t" min="0" max="255" value="100" aria-label="Threshold">
            </div>
        </div>

        <div>
            <div class="eyebrow">Output</div>
            <div class="button-group">
                <button id="btn-save">Save Still (PNG)</button>
                <button id="btn-rec">Record Video</button>
            </div>
        </div>
    </aside>

    <footer>
        THIS WAS MADE BY <a href="https://rappde.com" target="_blank" rel="noopener">RAPPDE.COM</a>
    </footer>
</main>

<video id="hidden-video" autoplay muted loop playsinline style="display:none"></video>

<script>
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const video = document.getElementById('hidden-video');
    const sX = document.getElementById('s-x');
    const sY = document.getElementById('s-y');
    const sT = document.getElementById('s-t');
    const btnCam = document.getElementById('btn-cam');
    const btnRec = document.getElementById('btn-rec');

    // willReadFrequently: verhindert das Deopt beim wiederholten getImageData
    const pCan = document.createElement('canvas');
    const pCtx = pCan.getContext('2d', { willReadFrequently: true });
    // map-canvas erst anlegen wenn wirklich eine custom-map kommt
    let mCan = null, mCtx = null;

    let mode = 'none', sourceImg = null, mapImg = null;
    let needsRender = false;           // still-modus rendert nur wenn was passiert ist
    let recorder, chunks = [];
    let camStream = null;
    let videoURL = null;               // aktive blob-url der video-quelle, wird revoked

    let outBuf = null, outImg = null;
    let mapCache = null, mapCacheImg = null, mapCacheW = 0, mapCacheH = 0;

    const isMobile = window.matchMedia('(pointer: coarse)').matches
        || window.matchMedia('(max-width: 900px)').matches;

    // Per-Pixel-Loop ist der Flaschenhals: Bewegtbild niedriger auflösen als Stills
    function limitFor(m) {
        if (m === 'image') return isMobile ? 900 : 1200;
        return isMobile ? 540 : 800;
    }

    // captureStream fehlt z.B. auf iOS Safari
    const recSupported = typeof canvas.captureStream === 'function' && typeof window.MediaRecorder === 'function';
    if (!recSupported) {
        btnRec.disabled = true;
        btnRec.textContent = 'Rec N/A';
    }

    document.getElementById('file-source').onchange = (e) => loadFile(e.target.files[0], false);
    document.getElementById('file-map').onchange = (e) => loadFile(e.target.files[0], true);

    // Leerer Zustand: Paper-Fläche mit Mono-Label statt schwarzem Block
    function drawPlaceholder() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#E8E5DD';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0B0B0C';
        const fs = Math.max(14, Math.round(canvas.width * 0.035));
        ctx.font = '700 ' + fs + "px 'JetBrains Mono', monospace";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('NO INPUT', canvas.width / 2, canvas.height / 2);
    }

    function stopCam() {
        if (!camStream) return;
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
        video.srcObject = null;
        btnCam.classList.remove('active');
        btnCam.textContent = 'Live_Cam';
    }

    function loadFile(file, isMap) {
        if (!file) return;
        const url = URL.createObjectURL(file);
        if (!isMap) {
            stopCam();
            if (file.type.startsWith('video/')) {
                if (videoURL) URL.revokeObjectURL(videoURL);   // alte video-quelle freigeben
                videoURL = url;
                mode = 'video';
                video.srcObject = null;
                video.src = url;
                video.onloadedmetadata = () => { initDim(video.videoWidth, video.videoHeight, limitFor('video')); video.play(); };
            } else {
                mode = 'image';
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);                   // bild dekodiert, url weg
                    sourceImg = img;
                    initDim(img.width, img.height, limitFor('image'));
                    needsRender = true;
                };
                img.src = url;
            }
        } else {
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                mapImg = img; mapCacheImg = null; needsRender = true;
            };
            img.src = url;
        }
    }

    function initDim(w, h, limit) {
        // laengere kante limitieren, sonst sprengt ein panorama den loop
        const scale = Math.min(1, limit / Math.max(w, h));
        canvas.width = Math.floor(w * scale);
        canvas.height = Math.floor(h * scale);
    }

    btnCam.onclick = async function() {
        if (camStream) {
            stopCam();
            mode = 'none';
            drawPlaceholder();
            return;
        }
        try {
            camStream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, facingMode: { ideal: 'environment' } }
            });
            video.src = '';                                    // alte datei-quelle vom element loesen
            video.srcObject = camStream;
            mode = 'live';
            video.onloadedmetadata = () => { initDim(video.videoWidth, video.videoHeight, limitFor('live')); video.play(); };
            this.classList.add('active');
            this.textContent = 'Stop_Cam';
        } catch (e) { alert('ERROR: CAMERA_ACCESS_DENIED'); camStream = null; }
    };

    function render() {
        if (mode === 'none') return;
        if ((mode === 'video' || mode === 'live') && video.readyState < 2) return;

        const strX = parseInt(sX.value);
        const strY = parseInt(sY.value);
        const thresh = parseInt(sT.value);

        const w = canvas.width, h = canvas.height;
        const src = mode === 'image' ? sourceImg : video;

        // kein versatz -> loop komplett sparen, direkt durchreichen
        if (strX === 0 && strY === 0) {
            ctx.drawImage(src, 0, 0, w, h);
            return;
        }

        pCan.width = w; pCan.height = h;
        pCtx.drawImage(src, 0, 0, w, h);
        const sData = pCtx.getImageData(0, 0, w, h);
        const pix = sData.data;

        // Displacement-Quelle: Custom-Map (gecacht) oder direkt die Luminanz der Quelle
        let mData;
        if (mapImg) {
            if (mapCacheImg === mapImg && mapCacheW === w && mapCacheH === h) {
                mData = mapCache;
            } else {
                if (!mCan) { mCan = document.createElement('canvas'); mCtx = mCan.getContext('2d', { willReadFrequently: true }); }
                mCan.width = w; mCan.height = h;
                mCtx.drawImage(mapImg, 0, 0, w, h);
                mData = mCtx.getImageData(0, 0, w, h).data;
                mapCache = mData; mapCacheImg = mapImg; mapCacheW = w; mapCacheH = h;
            }
        } else {
            mData = pix;
        }

        const need = pix.length;
        if (!outBuf || outBuf.length !== need) {
            outBuf = new Uint8ClampedArray(need);
            outImg = new ImageData(outBuf, w, h);              // einmal wrappen, nicht pro frame
        }
        outBuf.set(pix);

        const maxX = w - 1, maxY = h - 1;
        const t3 = thresh * 3;                                 // spart die division im heissen pfad
        let i = 0;
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++, i += 4) {
                const sum = mData[i] + mData[i + 1] + mData[i + 2];
                if (sum > t3) {
                    const f = (sum / 3 - 128) / 128;
                    let tx = x + ((f * strX) | 0);             // | 0 truncated symmetrisch um null
                    let ty = y + ((f * strY) | 0);
                    if (tx < 0) tx = 0; else if (tx > maxX) tx = maxX;
                    if (ty < 0) ty = 0; else if (ty > maxY) ty = maxY;
                    const ti = (ty * w + tx) * 4;

                    outBuf[i] = pix[ti];
                    outBuf[i + 1] = pix[ti + 1];
                    outBuf[i + 2] = pix[ti + 2];
                }
            }
        }

        ctx.putImageData(outImg, 0, 0);
    }

    function anim() {
        if ((mode === 'video' || mode === 'live') && video.readyState >= 2) {
            render();
        } else if (needsRender && mode === 'image') {
            needsRender = false;
            render();
        }
        requestAnimationFrame(anim);
    }
    anim();

    [sX, sY, sT].forEach(el => el.oninput = () => {
        document.getElementById('v-' + el.id.split('-')[1]).textContent = el.value;
        if (mode === 'image') needsRender = true;              // loop rendert, nicht jedes event
    });

    document.getElementById('btn-save').onclick = () => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `DR_DISPLACE_${Date.now()}.png`; a.click();
    };

    btnRec.onclick = function() {
        if (recorder && recorder.state === "recording") {
            recorder.stop();
            this.classList.remove('active');
            this.textContent = 'Record Video';
            document.getElementById('rec-ui').style.display = "none";
        } else {
            chunks = [];
            const candidates = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=h264', 'video/webm'];
            const mime = candidates.find(t => MediaRecorder.isTypeSupported(t)) || '';
            const ext = mime.includes('mp4') ? 'mp4' : 'webm';
            recorder = new MediaRecorder(canvas.captureStream(30), mime ? { mimeType: mime } : undefined);
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const b = new Blob(chunks, { type: mime || 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b); a.download = `DR_DISPLACE_${Date.now()}.${ext}`; a.click();
            };
            recorder.start();
            this.classList.add('active');
            this.textContent = 'Stop Recording';
            document.getElementById('rec-ui').style.display = "flex";
        }
    };

    // Init
    canvas.width = 800; canvas.height = 450;
    drawPlaceholder();
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (mode === 'none') drawPlaceholder(); });
    }
</script>
</body>
</html>
